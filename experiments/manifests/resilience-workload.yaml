apiVersion: v1
kind: Service
metadata:
  name: resilience-service
  namespace: default
spec:
  selector:
    app: resilience-target
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-target
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resilience-target
  template:
    metadata:
      labels:
        app: resilience-target
      annotations:
        k8s.v1.cni.cncf.io/networks: kube-system/flannel-backup
    spec:
      # The operator turns this condition off when the pod's node loses its primary
      # path, so the Service stops using the primary IP and uses the shadow slice with
      # the net1 (backup) IP instead. The pod is Ready only while the operator has set
      # it True, so the operator must be running for these pods to receive traffic.
      readinessGates:
      - conditionType: cniresilience.cn-operator/primary-path
      # Workers only: traffic-client runs on the control-plane node, so every request
      # crosses between nodes and a node fault cannot hide behind a local replica.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      # One replica per node, so a fault on one node never hides behind two pods there.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        # Count only pods of the same version, so old pods leaving during a rollout
        # cannot push both new replicas onto one node.
        matchLabelKeys:
        - pod-template-hash
        labelSelector:
          matchLabels:
            app: resilience-target
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
---
# Real traffic source for the /project2 page. Prints one line per request:
#   <unix time> <http code> <seconds>     (http code 000 = no response within 1 s)
# Uses the ClusterIP from the environment so a DNS failure is not counted as a Service failure.
apiVersion: v1
kind: Pod
metadata:
  name: traffic-client
  namespace: default
spec:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  containers:
  - name: client
    image: curlimages/curl
    command:
    - sh
    - -c
    - |
      while true; do
        echo "$(date +%s) $(curl -s -o /dev/null -m 1 -w '%{http_code} %{time_total}' "http://${RESILIENCE_SERVICE_SERVICE_HOST:-resilience-service}")"
        sleep 1
      done
---
# One pod on every node. Each answers HTTP and sends requests to the others, so the
# /project2 page can tell which node is broken. Runs on all nodes, tainted or not.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: path-probe
  namespace: default
spec:
  selector:
    matchLabels:
      app: path-probe
  template:
    metadata:
      labels:
        app: path-probe
    spec:
      tolerations:
      - operator: Exists
      containers:
      - name: probe
        image: nginx:alpine
        ports:
        - containerPort: 80
