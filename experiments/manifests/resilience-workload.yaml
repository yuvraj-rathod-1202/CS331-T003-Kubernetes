apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-target
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resilience-target
  template:
    metadata:
      labels:
        app: resilience-target
      annotations:
        k8s.v1.cni.cncf.io/networks: kube-system/flannel-backup
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: resilience-service
  namespace: default
spec:
  selector:
    app: resilience-target
  ports:
  - port: 80
    targetPort: 80