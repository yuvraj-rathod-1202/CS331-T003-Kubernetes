apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-checker
  namespace: default
  labels:
    app: dns-checker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dns-checker
  template:
    metadata:
      labels:
        app: dns-checker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - dns-checker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: checker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              # Helper: read milliseconds from /proc/uptime (works in BusyBox)
              now_ms() { awk '{split($1,a,"."); printf "%s%s\n", a[1], substr(a[2]"00",1,3)}' /proc/uptime; }

              while true; do
                echo "--- $(date '+%H:%M:%S') ---"

                # Internal DNS: resolve backend-api service
                START=$(now_ms)
                nslookup backend-api.default.svc.cluster.local > /dev/null 2>&1
                RESULT=$?
                END=$(now_ms)
                LATENCY=$((END - START))
                if [ $RESULT -eq 0 ]; then
                  echo "INTERNAL | OK   | ${LATENCY}ms"
                else
                  echo "INTERNAL | FAIL | ${LATENCY}ms"
                fi

                # External DNS: resolve google.com
                START=$(now_ms)
                nslookup google.com > /dev/null 2>&1
                RESULT=$?
                END=$(now_ms)
                LATENCY=$((END - START))
                if [ $RESULT -eq 0 ]; then
                  echo "EXTERNAL | OK   | ${LATENCY}ms"
                else
                  echo "EXTERNAL | FAIL | ${LATENCY}ms"
                fi

                sleep 3
              done
