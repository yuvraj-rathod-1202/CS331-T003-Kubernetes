# Client that SHOULD be allowed by the NetworkPolicy
apiVersion: v1
kind: Pod
metadata:
  name: netpolicy-client-allowed
  namespace: default
  labels:
    app: netpolicy-client
    role: allowed
spec:
  containers:
    - name: curl
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 --max-time 5 http://netpolicy-server/ 2>&1)
            echo "$(date '+%H:%M:%S') | allowed-client -> server | status=$RESPONSE"
            sleep 3
          done
---
# Client that SHOULD be blocked by the NetworkPolicy
apiVersion: v1
kind: Pod
metadata:
  name: netpolicy-client-blocked
  namespace: default
  labels:
    app: netpolicy-client
    role: blocked
spec:
  containers:
    - name: curl
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 --max-time 5 http://netpolicy-server/ 2>&1)
            echo "$(date '+%H:%M:%S') | blocked-client -> server | status=$RESPONSE"
            sleep 3
          done
