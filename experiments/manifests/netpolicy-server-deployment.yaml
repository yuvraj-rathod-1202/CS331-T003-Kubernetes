apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpolicy-server
  namespace: default
  labels:
    app: netpolicy-server
    role: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netpolicy-server
  template:
    metadata:
      labels:
        app: netpolicy-server
        role: server
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: netpolicy-server
  namespace: default
spec:
  selector:
    app: netpolicy-server
  ports:
    - port: 80
      targetPort: 80
