# Tiny Calico IPPool for IP exhaustion experiment
# /28 = 16 addresses, 14 usable (minus network + broadcast)
apiVersion: crd.projectcalico.org/v1
kind: IPPool
metadata:
  name: experiment-tiny-pool
spec:
  cidr: 10.200.0.0/28
  blockSize: 28
  ipipMode: Always
  natOutgoing: true
  nodeSelector: all()
