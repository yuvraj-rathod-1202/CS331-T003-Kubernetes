# DaemonSet for the CNI health agent.
#
# The agent is a normal pod, not hostNetwork, so its probes cross the real pod data
# path. It answers on port 9100, probes one peer each round, and writes results to an
# annotation on its own Node. Build it with:
#   go build -o bin/healthagent ./cmd/healthagent
#   docker build -f Dockerfile.healthagent -t cni-health-agent:dev bin
#   minikube -p k8s-experiments image load cni-health-agent:dev
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cni-health-agent
  namespace: kube-system
  labels:
    app: cni-health-agent
    app.kubernetes.io/component: health-agent
    app.kubernetes.io/part-of: cniresilience
spec:
  selector:
    matchLabels:
      app: cni-health-agent
  template:
    metadata:
      labels:
        app: cni-health-agent
        app.kubernetes.io/component: health-agent
      annotations:
        # Second interface net1 on the Flannel backup network, so the agents measure
        # the backup path too (deploy/multus-nad.yaml).
        k8s.v1.cni.cncf.io/networks: kube-system/flannel-backup
    spec:
      serviceAccountName: cni-health-agent
      tolerations:
        # Run on all nodes, including control plane and tainted ones
        - operator: Exists
      containers:
        - name: health-agent
          image: cni-health-agent:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: probe
              containerPort: 9100
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Peers are looked up only in this namespace (see Daemon.Namespace).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cni-health-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cni-health-agent
# Node patch cannot be limited to the agent's own Node with RBAC alone;
# deploy/healthagent-policy.yaml adds an admission policy that does that.
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  - apiGroups: ["remediation.cn-operator.yuvraj-rathod-1202.github.io"]
    resources: ["cniresiliences"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cni-health-agent
subjects:
  - kind: ServiceAccount
    name: cni-health-agent
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cni-health-agent
  apiGroup: rbac.authorization.k8s.io
---
# Agents only need their peers, which run in kube-system, so pods are readable
# there only instead of cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cni-health-agent
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cni-health-agent
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: cni-health-agent
    namespace: kube-system
roleRef:
  kind: Role
  name: cni-health-agent
  apiGroup: rbac.authorization.k8s.io
