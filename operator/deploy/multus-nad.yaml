# Multus NetworkAttachmentDefinition for the Flannel backup network.
#
# Pods annotated with k8s.v1.cni.cncf.io/networks: kube-system/flannel-backup get a
# second interface, net1, on the Flannel VXLAN overlay (10.244.0.0/16, from the node
# podCIDRs). Their main interface, eth0, stays on Calico (172.16.0.0/16).
#
# Needs flanneld running on every node (flannel-backup.yaml): the flannel plugin
# reads this node's subnet from /run/flannel/subnet.env.
#
# isDefaultGateway false: net1 only gets a route for 10.244.0.0/16. The default
# route stays on eth0, so normal traffic keeps using Calico.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: flannel-backup
  namespace: kube-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "flannel-backup",
      "type": "flannel",
      "delegate": {
        "isDefaultGateway": false,
        "hairpinMode": true
      }
    }
