text{font:12px system-ui,sans-serif;fill:var(--ink2)} .t{font-size:14px;font-weight:600;fill:var(--ink)}
.g{stroke:var(--grid);stroke-width:1} .a{stroke:var(--ink2);stroke-width:1}
</style>
