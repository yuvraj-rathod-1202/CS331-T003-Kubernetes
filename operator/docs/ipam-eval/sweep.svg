<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" role="img" aria-label="Pods served as the cluster grows (60 pods per node, /16 pool)">
<style>
svg{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e7e6e2;--c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#e87ba4;--c4:#6250d6;--c5:#eda100;}
