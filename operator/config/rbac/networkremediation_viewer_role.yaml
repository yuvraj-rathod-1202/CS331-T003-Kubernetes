# This rule is not used by the project operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to remediation.cn-operator.yuvraj-rathod-1202.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: networkremediation-viewer-role
rules:
- apiGroups:
  - remediation.cn-operator.yuvraj-rathod-1202.github.io
  resources:
  - networkremediations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - remediation.cn-operator.yuvraj-rathod-1202.github.io
  resources:
  - networkremediations/status
  verbs:
  - get
