# Sample CNIResilience CR — apply this to enable dual-CNI monitoring.
#
# This configures:
#   - Calico as the primary CNI (172.16.0.0/16, deploy/calico-primary-pool.yaml)
#   - Flannel as the backup CNI (10.244.0.0/16, deploy/flannel-backup.yaml)
#   - 2-second probe interval with 3 failure threshold
#   - Automatic recovery and failover enabled
#
# Usage:
#   kubectl apply -f config/samples/cniresilience_sample.yaml
apiVersion: remediation.cn-operator.yuvraj-rathod-1202.github.io/v1alpha1
kind: CNIResilience
metadata:
  name: default-resilience
spec:
  primaryCNI:
    name: calico
    namespace: kube-system
    daemonSetName: calico-node
    healthEndpoint: "http://localhost:9099/liveness"
    addressSpace: "172.16.0.0/16"
  backupCNI:
    name: flannel
    namespace: kube-flannel
    daemonSetName: kube-flannel-ds
    healthEndpoint: ""  # Flannel has no built-in health endpoint
    addressSpace: "10.244.0.0/16"
  probeIntervalSeconds: 2
  probeTimeoutSeconds: 1
  failureThreshold: 3
  autoRecover: true
  autoFailover: true
