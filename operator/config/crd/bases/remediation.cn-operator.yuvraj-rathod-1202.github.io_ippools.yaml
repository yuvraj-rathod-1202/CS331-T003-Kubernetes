---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ippools.remediation.cn-operator.yuvraj-rathod-1202.github.io
spec:
  group: remediation.cn-operator.yuvraj-rathod-1202.github.io
  names:
    kind: IPPool
    listKind: IPPoolList
    plural: ippools
    singular: ippool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.totalAddresses
      name: Total
      type: integer
    - jsonPath: .status.allocatedAddresses
      name: Allocated
      type: integer
    - jsonPath: .status.freeAddresses
      name: Free
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IPPool is the Schema for the ippools API.
          It represents a set of CIDR ranges managed by the buddy allocator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IPPoolSpec defines the desired state of an IPPool.
            properties:
              cidrs:
                description: |-
                  CIDRs is the list of CIDR blocks available for allocation.
                  Supports discontiguous ranges (e.g. ["10.244.0.0/16", "172.20.0.0/18"]).
                items:
                  type: string
                minItems: 1
                type: array
              expandThresholdPercent:
                default: 80
                description: |-
                  ExpandThresholdPercent is the per-node usage percentage at which the
                  controller proactively allocates an additional block. Default: 80.
                maximum: 95
                minimum: 50
                type: integer
              maxBlockSize:
                default: 22
                description: |-
                  MaxBlockSize is the largest block a single node can receive,
                  expressed as a prefix length. Default: 22 (1024 addresses).
                maximum: 26
                minimum: 16
                type: integer
              minBlockSize:
                default: 28
                description: |-
                  MinBlockSize is the smallest block the buddy allocator will hand out,
                  expressed as a prefix length. Default: 28 (16 addresses).
                maximum: 30
                minimum: 24
                type: integer
            required:
            - cidrs
            type: object
          status:
            description: IPPoolStatus defines the observed state of an IPPool.
            properties:
              allocatedAddresses:
                description: AllocatedAddresses is the number of addresses currently
                  assigned to nodes.
                format: int64
                type: integer
              freeAddresses:
                description: FreeAddresses is TotalAddresses - AllocatedAddresses.
                format: int64
                type: integer
              lastReconcileTime:
                description: LastReconcileTime is the last time the controller reconciled
                  this pool.
                format: date-time
                type: string
              nodeAllocations:
                description: NodeAllocations summarises per-node block assignments.
                items:
                  description: NodeAllocationSummary is a per-node view embedded in
                    IPPoolStatus.
                  properties:
                    allocatedIPs:
                      description: AllocatedIPs is how many individual pod IPs are
                        in use on this node.
                      type: integer
                    blocks:
                      description: Blocks lists the CIDR blocks currently assigned
                        to this node.
                      items:
                        type: string
                      type: array
                    nodeName:
                      description: NodeName is the name of the Kubernetes node.
                      type: string
                    totalCapacity:
                      description: TotalCapacity is the sum of addresses in all blocks
                        assigned to this node.
                      type: integer
                    utilizationPercent:
                      description: UtilizationPercent is (AllocatedIPs / TotalCapacity)
                        * 100.
                      type: integer
                  required:
                  - allocatedIPs
                  - nodeName
                  - totalCapacity
                  - utilizationPercent
                  type: object
                type: array
              phase:
                description: 'Phase is the current state of the pool: "Ready", "Exhausted",
                  "Degraded".'
                type: string
              totalAddresses:
                description: TotalAddresses is the total number of addresses across
                  all CIDRs.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
