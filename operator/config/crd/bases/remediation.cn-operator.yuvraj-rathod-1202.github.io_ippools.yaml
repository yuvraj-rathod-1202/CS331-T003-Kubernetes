---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ippools.remediation.cn-operator.yuvraj-rathod-1202.github.io
spec:
  group: remediation.cn-operator.yuvraj-rathod-1202.github.io
  names:
    kind: IPPool
    listKind: IPPoolList
    plural: ippools
    singular: ippool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.totalAddresses
      name: Total
      type: integer
    - jsonPath: .status.allocatedAddresses
      name: Allocated
      type: integer
    - jsonPath: .status.freeAddresses
      name: Free
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IPPool is the Schema for the ippools API.
          It represents a set of CIDR ranges managed by the buddy allocator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: IPPoolSpec defines the desired state of an IPPool.
            properties:
              capacityCapPercent:
                default: 120
                description: |-
                  CapacityCapPercent caps a node's total capacity at this percentage of its
                  allocatable pod count, so a leak cannot grow a node forever. Default: 120.
                minimum: 100
                type: integer
              cidrs:
                description: |-
                  CIDRs is the list of CIDR blocks available for allocation.
                  Supports discontiguous ranges (e.g. ["10.244.0.0/16", "172.20.0.0/18"]).
                items:
                  type: string
                minItems: 1
                type: array
              disableShrink:
                description: DisableShrink turns off draining. Blocks are then only
                  ever added.
                type: boolean
              expandThresholdPercent:
                default: 80
                description: |-
                  ExpandThresholdPercent is the per-node usage percentage at which the
                  controller proactively allocates an additional block. Default: 80.
                maximum: 95
                minimum: 50
                type: integer
              growthPercent:
                default: 50
                description: |-
                  GrowthPercent is how much a node grows by, as a percentage of its current
                  capacity, rounded up to a power of two (at least one minimum block).
                  Default: 50.
                maximum: 100
                minimum: 1
                type: integer
              initialBlockPercent:
                default: 25
                description: |-
                  InitialBlockPercent sizes a new node's first block as a percentage of its
                  allocatable pod count, rounded up to a power of two, with a floor of
                  16 addresses. This block is also the node's capacity floor. Default: 25.
                maximum: 100
                minimum: 1
                type: integer
              lowWaterPercent:
                default: 10
                description: |-
                  LowWaterPercent: the pool reports Degraded when the free share of its
                  address space falls below this. Default: 10.
                maximum: 90
                minimum: 0
                type: integer
              maxBlockSize:
                default: 22
                description: |-
                  MaxBlockSize is the largest block a single node can receive,
                  expressed as a prefix length. Default: 22 (1024 addresses).
                maximum: 26
                minimum: 16
                type: integer
              minBlockSize:
                default: 28
                description: |-
                  MinBlockSize is the smallest block the buddy allocator will hand out,
                  expressed as a prefix length. Default: 28 (16 addresses).
                maximum: 30
                minimum: 24
                type: integer
              quarantineSeconds:
                default: 60
                description: |-
                  QuarantineSeconds is how long a drained block is held back before it can
                  be handed to another node, so stale routes and late packets cannot reach a
                  new owner. Default: 60.
                minimum: 0
                type: integer
              reservedCIDRs:
                description: |-
                  ReservedCIDRs are ranges the pool must not overlap, such as the Service
                  CIDR, the node network or Docker bridges. Pool CIDRs that overlap one of
                  these, or a node's InternalIP, are rejected.
                items:
                  type: string
                type: array
              shrinkCooldownSeconds:
                default: 300
                description: |-
                  ShrinkCooldownSeconds is how long a block must have been Active before it
                  can be drained. Default: 300.
                minimum: 0
                type: integer
              shrinkThresholdPercent:
                default: 50
                description: |-
                  ShrinkThresholdPercent: a node gives a block back only if, once the block
                  is drained, its remaining capacity would be at most this percent used.
                  Keep it well below ExpandThresholdPercent, or blocks flap. Default: 50.
                maximum: 90
                minimum: 1
                type: integer
              triggerFloor:
                default: 8
                description: |-
                  TriggerFloor is the absolute number of free addresses below which a node
                  grows, even when its utilisation is still under ExpandThresholdPercent.
                  It should cover pod start rate x reaction time. Default: 8.
                minimum: 0
                type: integer
            required:
            - cidrs
            type: object
          status:
            description: IPPoolStatus defines the observed state of an IPPool.
            properties:
              allocatedAddresses:
                description: AllocatedAddresses is the number of addresses currently
                  assigned to nodes.
                format: int64
                type: integer
              cidrs:
                description: |-
                  CIDRs reports how much of each pool CIDR is handed out. CIDRs are filled
                  in order, so a later one stays Standby until the earlier ones are full.
                items:
                  description: CIDRUsage is the usage of one pool CIDR.
                  properties:
                    allocated:
                      format: int64
                      type: integer
                    cidr:
                      type: string
                    state:
                      description: State is Active (some of it is handed out), Standby
                        (none yet) or Full.
                      type: string
                    total:
                      format: int64
                      type: integer
                  required:
                  - allocated
                  - cidr
                  - state
                  - total
                  type: object
                type: array
              freeAddresses:
                description: FreeAddresses is TotalAddresses - AllocatedAddresses.
                format: int64
                type: integer
              lastReconcileTime:
                description: LastReconcileTime is the last time the controller reconciled
                  this pool.
                format: date-time
                type: string
              message:
                description: Message explains a Degraded, Exhausted or Inactive phase.
                type: string
              nodeAllocations:
                description: NodeAllocations summarises per-node block assignments.
                items:
                  description: NodeAllocationSummary is a per-node view embedded in
                    IPPoolStatus.
                  properties:
                    allocatedIPs:
                      description: AllocatedIPs is how many individual pod IPs are
                        in use on this node.
                      type: integer
                    blocks:
                      description: Blocks lists the CIDR blocks currently assigned
                        to this node.
                      items:
                        type: string
                      type: array
                    nodeName:
                      description: NodeName is the name of the Kubernetes node.
                      type: string
                    totalCapacity:
                      description: TotalCapacity is the sum of addresses in all blocks
                        assigned to this node.
                      type: integer
                    utilizationPercent:
                      description: UtilizationPercent is (AllocatedIPs / TotalCapacity)
                        * 100.
                      type: integer
                  required:
                  - allocatedIPs
                  - nodeName
                  - totalCapacity
                  - utilizationPercent
                  type: object
                type: array
              phase:
                description: |-
                  Phase is the current state of the pool: "Ready", "Exhausted", "Degraded",
                  or "Inactive" when another IPPool is serving the cluster's nodes.
                type: string
              totalAddresses:
                description: TotalAddresses is the total number of addresses across
                  all CIDRs.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
