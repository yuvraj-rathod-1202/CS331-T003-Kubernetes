---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: nodeblocks.remediation.cn-operator.yuvraj-rathod-1202.github.io
spec:
  group: remediation.cn-operator.yuvraj-rathod-1202.github.io
  names:
    kind: NodeBlock
    listKind: NodeBlockList
    plural: nodeblocks
    singular: nodeblock
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .spec.cidr
      name: CIDR
      type: string
    - jsonPath: .status.usedAddresses
      name: Used
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeBlock is one buddy block assigned to one node. Its name is derived from
          the CIDR, so the API server's name uniqueness prevents the same block being
          allocated twice. The controller keeps no private state: it rebuilds every
          buddy tree from these objects.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeBlockSpec is written only by the controller.
            properties:
              cidr:
                description: CIDR is the block, aligned to its own size (e.g. "10.244.0.64/27").
                type: string
              drain:
                description: |-
                  Drain asks the owner to stop handing out addresses from the block. The
                  controller sets it to shrink a node; it clears it again if the node needs
                  the space back before the drain finishes.
                type: boolean
              nodeName:
                description: NodeName is the node that owns the block.
                type: string
              poolRef:
                description: PoolRef is the IPPool the block was carved from.
                type: string
            required:
            - cidr
            - nodeName
            - poolRef
            type: object
          status:
            description: |-
              NodeBlockStatus is written only by the node agent (and, for lifecycle phases
              the agent cannot observe, by the controller).
            properties:
              lastTransitionTime:
                description: LastTransitionTime is when Phase last changed.
                format: date-time
                type: string
              phase:
                description: Phase is Pending, Active, Draining, Quarantined or Released.
                type: string
              reclaimedLeases:
                description: |-
                  ReclaimedLeases counts leaked host-local leases the agent removed from
                  this block: leases with no pod behind them.
                type: integer
              routesAckedBy:
                description: RoutesAckedBy lists the nodes that have installed a route
                  for this block.
                items:
                  type: string
                type: array
              usedAddresses:
                description: |-
                  UsedAddresses is how many addresses in the block hold a lease, counted
                  from the node's host-local lease files.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
