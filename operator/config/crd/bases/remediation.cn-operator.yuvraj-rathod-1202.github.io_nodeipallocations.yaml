spec:
  group: remediation.cn-operator.yuvraj-rathod-1202.github.io
  names:
    kind: NodeIPAllocation
    listKind: NodeIPAllocationList
    plural: nodeipallocations
    singular: nodeipallocation
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.totalCapacity
      name: Capacity
      type: integer
    - jsonPath: .status.allocatedIPs
      name: Used
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodeIPAllocation is the Schema for the nodeipallocations API.
          One NodeIPAllocation exists per node, tracking its buddy-allocated blocks.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodeIPAllocationSpec defines the desired allocation for a
              single node.
            properties:
              nodeName:
                description: NodeName is the Kubernetes node this allocation targets.
                type: string
              poolRef:
                description: PoolRef is the name of the IPPool this allocation draws
                  from.
                type: string
            required:
            - nodeName
            - poolRef
            type: object
          status:
            description: NodeIPAllocationStatus defines the observed allocation state
              for a node.
            properties:
              allocatedIPs:
                description: AllocatedIPs is the number of pod IPs currently in use.
                type: integer
              blocks:
                description: Blocks lists the CIDR blocks currently assigned to this
                  node.
                items:
                  description: AllocatedBlock represents a single CIDR block assigned
                    to a node.
                  properties:
                    addresses:
                      description: Addresses is the number of addresses in this block
                        (2^(32-prefixLength)).
                      type: integer
                    cidr:
                      description: CIDR is the block in CIDR notation, e.g. "10.244.3.0/25".
                      type: string
                    prefixLength:
                      description: PrefixLength is the prefix length of this block
                        (e.g. 25).
                      type: integer
                    state:
                      description: 'State: "Active", "Draining", "Free".'
                      type: string
                    usedAddresses:
                      description: UsedAddresses is how many addresses in this block
                        are occupied by pods.
                      type: integer
                  required:
                  - addresses
                  - cidr
                  - prefixLength
                  - state
                  - usedAddresses
                  type: object
                type: array
              lastReconcileTime:
                description: LastReconcileTime is the last time this allocation was
                  checked.
                format: date-time
                type: string
              leakedIPs:
                description: LeakedIPs is the number of IPs that appear allocated
                  but have no running pod.
                type: integer
              phase:
                description: 'Phase: "Healthy", "NearExhaustion", "Exhausted".'
                type: string
              totalCapacity:
                description: TotalCapacity is the sum of addresses in all assigned
                  blocks.
                type: integer
            type: object
