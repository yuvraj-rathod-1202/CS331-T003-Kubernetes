---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: networkremediations.remediation.cn-operator.yuvraj-rathod-1202.github.io
spec:
  group: remediation.cn-operator.yuvraj-rathod-1202.github.io
  names:
    kind: NetworkRemediation
    listKind: NetworkRemediationList
    plural: networkremediations
    singular: networkremediation
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetworkRemediation is the Schema for the networkremediations API.
          It defines the configuration for the network remediation operator,
          which monitors and auto-heals networking failures in a Kubernetes cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of NetworkRemediation
            properties:
              cni:
                description: CNI configures CNI plugin health monitoring and remediation.
                properties:
                  calicoDaemonSetName:
                    default: calico-node
                    description: CalicoDaemonSetName is the name of the Calico CNI
                      DaemonSet.
                    type: string
                  calicoNamespace:
                    default: kube-system
                    description: CalicoNamespace is the namespace where calico-node
                      DaemonSet lives.
                    type: string
                  enabled:
                    default: true
                    description: Enabled toggles the CNI monitoring module.
                    type: boolean
                  ipamUsageThresholdPercent:
                    default: 80
                    description: |-
                      IPAMUsageThresholdPercent triggers an alert when Calico's IP pool
                      utilisation exceeds this percentage (0–100).
                    type: integer
                  stuckPodThresholdSeconds:
                    default: 60
                    description: |-
                      StuckPodThresholdSeconds is how long (in seconds) a pod may sit in
                      ContainerCreating with no pod IP before it is considered CNI-stuck.
                    type: integer
                required:
                - enabled
                type: object
              coreDNS:
                description: CoreDNS configures DNS health monitoring and remediation.
                properties:
                  autoHealConfigMap:
                    default: true
                    description: AutoHealConfigMap automatically repairs corrupted
                      upstream resolvers in the CoreDNS ConfigMap.
                    type: boolean
                  autoHealReplicas:
                    default: true
                    description: AutoHealReplicas automatically restores deployment
                      replicas if scaled down or missing.
                    type: boolean
                  enabled:
                    default: true
                    description: Enabled toggles the CoreDNS monitoring module.
                    type: boolean
                  expectedReplicas:
                    default: 2
                    description: 'ExpectedReplicas defines the desired number of CoreDNS
                      replicas (default: 2).'
                    format: int32
                    type: integer
                  fallbackUpstreamServers:
                    description: FallbackUpstreamServers are the fallback upstream
                      DNS resolvers to inject if upstream is corrupted.
                    items:
                      type: string
                    type: array
                  latencyThresholdMs:
                    default: 150
                    description: 'LatencyThresholdMs defines the maximum acceptable
                      DNS latency in milliseconds (default: 150).'
                    format: int64
                    type: integer
                  upstreamDnsValidation:
                    default: true
                    description: UpstreamDNSValidation toggles validation of the CoreDNS
                      ConfigMap upstream forward directive.
                    type: boolean
                required:
                - enabled
                type: object
              networkPolicy:
                description: NetworkPolicy configures NetworkPolicy enforcement verification.
                properties:
                  autoHeal:
                    default: true
                    description: |-
                      AutoHeal automatically restarts degraded or crashlooping calico-node enforcement
                      agent pods so that felix re-syncs and repopulates kernel packet-filtering rules.
                      When false, enforcement degradation is only reported in status/events.
                    type: boolean
                  cooldownSeconds:
                    default: 60
                    description: |-
                      CooldownSeconds specifies the minimum cooldown period in seconds between
                      enforcement agent pod restarts to avoid restart-thrashing.
                    format: int32
                    type: integer
                  enabled:
                    default: true
                    description: Enabled toggles the NetworkPolicy enforcement monitoring
                      module.
                    type: boolean
                required:
                - enabled
                type: object
              podConnectivity:
                description: PodConnectivity configures pod-to-pod and internode connectivity
                  probing.
                properties:
                  checkPolicy:
                    description: CheckPolicy configures probing mechanics, topology,
                      and probe intervals.
                    properties:
                      anchors:
                        description: Anchors defines static external anchors for corroboration.
                        items:
                          description: AnchorTarget defines a static anchor for out-of-band
                            triangulation.
                          properties:
                            address:
                              type: string
                            name:
                              type: string
                            port:
                              type: integer
                            protocol:
                              type: string
                          required:
                          - address
                          - name
                          type: object
                        type: array
                      intervalSeconds:
                        default: 10
                        description: IntervalSeconds is how frequently probes execute.
                        maximum: 300
                        minimum: 2
                        type: integer
                      probePort:
                        default: 9099
                        description: ProbePort is the port on which the probe agent
                          and responders listen.
                        type: integer
                      probeProtocol:
                        default: tcp
                        description: 'ProbeProtocol specifies network protocol: "tcp"
                          or "http".'
                        enum:
                        - tcp
                        - http
                        type: string
                      timeoutSeconds:
                        default: 2
                        description: TimeoutSeconds specifies timeout for each synthetic
                          probe.
                        maximum: 30
                        minimum: 1
                        type: integer
                      topology:
                        default: ring
                        description: 'Topology defines the probing graph: "ring",
                          "mesh", or "sampled".'
                        enum:
                        - ring
                        - mesh
                        - sampled
                        type: string
                    type: object
                  enabled:
                    default: true
                    description: Enabled toggles the pod connectivity monitoring module.
                    type: boolean
                  evaluatePolicy:
                    description: EvaluatePolicy configures triangulation thresholds
                      and anchor validation.
                    properties:
                      anchorCorroborationEnabled:
                        default: true
                        description: AnchorCorroborationEnabled enables verification
                          against static system anchors.
                        type: boolean
                      consecutiveFailureThreshold:
                        default: 3
                        description: ConsecutiveFailureThreshold specifies how many
                          probe failures confirm an issue.
                        type: integer
                      localCNIValidationEnabled:
                        default: true
                        description: LocalCNIValidationEnabled enables host-to-pod
                          loopback verification.
                        type: boolean
                      packetLossThresholdPercent:
                        default: 20
                        description: PacketLossThresholdPercent defines degradation
                          threshold.
                        type: integer
                      triangulationEnabled:
                        default: true
                        description: TriangulationEnabled enables cross-node triangulation.
                        type: boolean
                    type: object
                  remediationPolicy:
                    description: RemediationPolicy specifies automated healing steps
                      and escalation limits.
                    properties:
                      autoRemediationEnabled:
                        default: true
                        description: AutoRemediationEnabled permits the operator to
                          execute corrective actions.
                        type: boolean
                      cniSubsystem:
                        description: CNISubsystem configures restarts of the node's
                          local CNI agent.
                        properties:
                          daemonSetName:
                            default: calico-node
                            description: DaemonSetName is the name of the CNI DaemonSet
                              (e.g. "calico-node", "kindnet").
                            type: string
                          enabled:
                            default: true
                            description: Enabled allows restarting local CNI DaemonSet
                              pod.
                            type: boolean
                          maxRestartAttempts:
                            default: 2
                            description: MaxRestartAttempts is the maximum attempts
                              before escalating to drain.
                            type: integer
                          namespace:
                            default: kube-system
                            description: Namespace is the namespace where the CNI
                              DaemonSet lives.
                            type: string
                          restartBackoffSeconds:
                            default: 60
                            description: RestartBackoffSeconds is cooldown between
                              restarts.
                            type: integer
                        type: object
                      nodeDrain:
                        description: NodeDrain configures workload eviction when lower
                          tiers fail.
                        properties:
                          deleteEmptyDirData:
                            default: true
                            description: DeleteEmptyDirData allows eviction of pods
                              with emptyDir volumes.
                            type: boolean
                          drainTimeoutSeconds:
                            default: 120
                            description: DrainTimeoutSeconds is eviction timeout.
                            type: integer
                          enabled:
                            default: true
                            description: Enabled permits node draining.
                            type: boolean
                          escalateAfterFailedRestarts:
                            default: 2
                            description: EscalateAfterFailedRestarts triggers drain
                              after CNI restarts fail.
                            type: integer
                          ignoreDaemonSets:
                            default: true
                            description: IgnoreDaemonSets skips DaemonSet pods during
                              eviction.
                            type: boolean
                        type: object
                      nodeIsolation:
                        description: NodeIsolation configures taints and cordoning
                          for degraded nodes.
                        properties:
                          cordonNode:
                            default: true
                            description: CordonNode marks the node unschedulable.
                            type: boolean
                          taintEffect:
                            default: NoSchedule
                            description: TaintEffect is the effect applied (NoSchedule,
                              PreferNoSchedule).
                            type: string
                          taintKey:
                            default: network-degraded
                            description: TaintKey is the taint key applied to degraded
                              nodes.
                            type: string
                          taintNode:
                            default: true
                            description: TaintNode adds a taint to faulty nodes.
                            type: boolean
                          taintValue:
                            default: "true"
                            description: TaintValue is the value of the taint.
                            type: string
                        type: object
                    type: object
                  targetNamespace:
                    default: default
                    description: TargetNamespace is the namespace where probing pods
                      or responders are located.
                    type: string
                required:
                - enabled
                type: object
            type: object
          status:
            description: status defines the observed state of NetworkRemediation
            properties:
              cni:
                description: CNI is the observed state of the CNI module.
                properties:
                  enabled:
                    description: Enabled indicates whether this module is currently
                      active.
                    type: boolean
                  healthy:
                    description: Healthy indicates whether the module's checks are
                      passing.
                    type: boolean
                  lastChecked:
                    description: LastChecked is the timestamp of the last health check.
                    format: date-time
                    type: string
                  message:
                    description: Message is a human-readable message about the module's
                      current state.
                    type: string
                required:
                - enabled
                - healthy
                type: object
              coreDNS:
                description: CoreDNS is the observed state of the CoreDNS module.
                properties:
                  enabled:
                    description: Enabled indicates whether this module is currently
                      active.
                    type: boolean
                  healthy:
                    description: Healthy indicates whether the module's checks are
                      passing.
                    type: boolean
                  lastChecked:
                    description: LastChecked is the timestamp of the last health check.
                    format: date-time
                    type: string
                  message:
                    description: Message is a human-readable message about the module's
                      current state.
                    type: string
                required:
                - enabled
                - healthy
                type: object
              lastReconcileTime:
                description: LastReconcileTime is the timestamp of the last successful
                  reconcile.
                format: date-time
                type: string
              networkPolicy:
                description: NetworkPolicy is the observed state of the NetworkPolicy
                  module.
                properties:
                  enabled:
                    description: Enabled indicates whether this module is currently
                      active.
                    type: boolean
                  healthy:
                    description: Healthy indicates whether the module's checks are
                      passing.
                    type: boolean
                  lastChecked:
                    description: LastChecked is the timestamp of the last health check.
                    format: date-time
                    type: string
                  message:
                    description: Message is a human-readable message about the module's
                      current state.
                    type: string
                required:
                - enabled
                - healthy
                type: object
              phase:
                description: Phase is the overall phase of the operator (e.g., "Running",
                  "Degraded", "Error").
                type: string
              podConnectivity:
                description: PodConnectivity is the observed state of the PodConnectivity
                  module.
                properties:
                  enabled:
                    description: Enabled indicates whether this module is currently
                      active.
                    type: boolean
                  healthy:
                    description: Healthy indicates whether the module's checks are
                      passing.
                    type: boolean
                  lastChecked:
                    description: LastChecked is the timestamp of the last health check.
                    format: date-time
                    type: string
                  message:
                    description: Message is a human-readable message about the module's
                      current state.
                    type: string
                required:
                - enabled
                - healthy
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
