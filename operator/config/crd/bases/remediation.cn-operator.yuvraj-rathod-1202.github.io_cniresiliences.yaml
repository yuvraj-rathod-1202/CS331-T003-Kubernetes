  group: remediation.cn-operator.yuvraj-rathod-1202.github.io
  names:
    kind: CNIResilience
    listKind: CNIResilienceList
    plural: cniresiliences
    singular: cniresilience
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.failoverCount
      name: Failovers
      type: integer
    - jsonPath: .status.recoveryCount
      name: Recoveries
      type: integer
    - jsonPath: .status.failoverActive
      name: FailoverActive
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CNIResilience is the Schema for the cniresiliences API.
          One per cluster — configures dual-CNI monitoring, failover and recovery.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CNIResilienceSpec defines the desired state of CNIResilience.
            properties:
              autoFailover:
                default: true
                description: |-
                  AutoFailover controls whether traffic is automatically switched
                  to the backup path on primary failure.
                type: boolean
              autoRecover:
                default: true
                description: |-
                  AutoRecover controls whether the controller automatically restarts
                  the failed CNI agent and restores routes.
                type: boolean
              backupCNI:
                description: BackupCNI describes the backup CNI (e.g. Flannel).
                properties:
                  addressSpace:
                    description: AddressSpace is the CIDR used by this CNI (e.g. "10.244.0.0/16").
                    type: string
                  daemonSetName:
                    description: DaemonSetName is the name of the CNI agent DaemonSet.
                    type: string
                  healthEndpoint:
                    description: |-
                      HealthEndpoint is the URL the health agent uses to check this CNI's agent.
                      e.g. "http://localhost:9099/liveness" for Calico.
                    type: string
                  name:
                    description: Name is a human-readable name (e.g. "calico", "flannel").
                    type: string
                  namespace:
                    description: Namespace is the namespace where the CNI agent DaemonSet
                      runs.
                    type: string
                required:
                - addressSpace
                - daemonSetName
                - name
                - namespace
                type: object
              failureThreshold:
                default: 3
                description: FailureThreshold is how many consecutive probe failures
                  mark a path as down.
                minimum: 1
                type: integer
              linkFailover:
                default: true
                description: |-
                  LinkFailover controls whether a single broken node-to-node link is steered
                  onto the backup path. A nil value means enabled.
                type: boolean
              linkRelay:
                default: true
                description: |-
                  LinkRelay controls whether a link with no direct path is relayed through
                  a third node. A nil value means enabled.
                type: boolean
              primaryCNI:
                description: PrimaryCNI describes the primary CNI (e.g. Calico).
                properties:
                  addressSpace:
                    description: AddressSpace is the CIDR used by this CNI (e.g. "10.244.0.0/16").
                    type: string
                  daemonSetName:
                    description: DaemonSetName is the name of the CNI agent DaemonSet.
                    type: string
                  healthEndpoint:
                    description: |-
                      HealthEndpoint is the URL the health agent uses to check this CNI's agent.
                      e.g. "http://localhost:9099/liveness" for Calico.
                    type: string
                  name:
                    description: Name is a human-readable name (e.g. "calico", "flannel").
                    type: string
                  namespace:
                    description: Namespace is the namespace where the CNI agent DaemonSet
                      runs.
                    type: string
                required:
                - addressSpace
                - daemonSetName
                - name
                - namespace
                type: object
              probeIntervalSeconds:
                default: 5
                description: ProbeIntervalSeconds is how often the health agent probes
                  each path.
                maximum: 60
                minimum: 1
                type: integer
              probeTimeoutSeconds:
                default: 2
                description: ProbeTimeoutSeconds is the timeout for a single probe.
                type: integer
            required:
            - backupCNI
            - primaryCNI
            type: object
          status:
            description: CNIResilienceStatus defines the observed state of CNIResilience.
            properties:
              conditions:
                description: Conditions holds the standard conditions, such as LinksReachable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failoverActive:
                description: FailoverActive is true if any node is currently using
                  the backup path.
                type: boolean
              failoverCount:
                description: FailoverCount is total number of failovers performed.
                type: integer
              lastReconcileTime:
                description: LastReconcileTime is when the controller last ran.
                format: date-time
                type: string
              links:
                description: Links is the path currently used for each directed node-to-node
                  link.
                items:
                  description: LinkStatus is the path used from one node to another.
                  properties:
                    from:
                      description: From is the source node name.
                      type: string
                    path:
                      description: Path is "primary", "backup", "relay" or "none".
                      type: string
                    since:
                      description: Since is when the link last changed path.
                      format: date-time
                      type: string
                    to:
                      description: To is the destination node name.
                      type: string
                    via:
                      description: Via is the relay node when Path is "relay".
                      type: string
                  required:
                  - from
                  - path
                  - to
                  type: object
                type: array
              nodeStatuses:
                description: NodeStatuses contains per-node health information.
                items:
                  description: NodeCNIStatus holds the health of both CNI paths on
                    a single node.
                  properties:
                    activePath:
                      description: |-
                        ActivePath is which path is currently carrying traffic: "primary", "backup", or
                        "none" when neither reaches the node and its pods are out of the Service.
                      type: string
                    backupConsecutiveFailures:
                      description: BackupConsecutiveFailures is the current failure
                        streak for the backup path.
                      type: integer
                    backupHealthy:
                      description: BackupHealthy is true if the backup CNI path is
                        working.
                      type: boolean
                    lastFailoverTime:
                      description: LastFailoverTime is when the last failover happened
                        on this node (if any).
                      format: date-time
                      type: string
                    lastProbeTime:
                      description: LastProbeTime is when this node was last probed.
                      format: date-time
                      type: string
                    lastRecoveryTime:
                      description: LastRecoveryTime is when the last recovery happened
                        on this node (if any).
                      format: date-time
                      type: string
                    message:
                      description: Message is a human-readable status message.
                      type: string
                    nodeName:
                      description: NodeName is the Kubernetes node name.
                      type: string
                    primaryConsecutiveFailures:
                      description: PrimaryConsecutiveFailures is the current failure
                        streak for the primary path.
                      type: integer
                    primaryHealthy:
                      description: PrimaryHealthy is true if the primary CNI path
                        is working.
                      type: boolean
                  required:
                  - activePath
                  - backupHealthy
                  - nodeName
                  - primaryHealthy
                  type: object
                type: array
              phase:
                description: 'Phase is the overall cluster-level state: "Healthy",
                  "Degraded", "FailedOver".'
                type: string
              recoveryCount:
                description: RecoveryCount is total number of automatic recoveries
                  performed.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
