name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./operator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ./operator

      - name: Run tests
        run: make test

      - name: Build
        run: make build

      - name: Verify manifests are up to date
        run: |
          make manifests
          git diff --exit-code config/
